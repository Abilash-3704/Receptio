name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real Postgres so the concurrency tests (tests/test_concurrency.py) run instead of being
    # skipped, and the whole backend suite runs through the Alembic migrations. The tests drop
    # and rebuild the `public` schema of this throwaway database for every test.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: receptio
          POSTGRES_PASSWORD: receptio
          POSTGRES_DB: receptio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receptio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://receptio:receptio@localhost:5432/receptio
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      # The `llm` extra so pyright can see the anthropic SDK that agent/anthropic_llm.py imports.
      # Never `voice`: the two extras conflict. No test calls the real API.
      - run: uv sync --frozen
      - run: uv run ruff format --check agent backend tests
      - run: uv run ruff check agent backend tests
      - run: uv run pyright
      # -rs lists skips with reasons; with Postgres up, none should mention TEST_DATABASE_URL.
      - run: uv run pytest -rs

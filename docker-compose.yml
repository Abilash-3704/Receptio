services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receptio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-receptio}
      POSTGRES_DB: ${POSTGRES_DB:-receptio}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receptio}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: .
    command: ["uvicorn", "backend.app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-receptio}:${POSTGRES_PASSWORD:-receptio}@db:5432/${POSTGRES_DB:-receptio}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      # Cost guard. CAPS_TEST_MODE is for the local load test only: the backend refuses to start
      # with it while DEPLOYED_ENVIRONMENT is true, so set DEPLOYED_ENVIRONMENT=true when deploying.
      CALL_MAX_SECONDS: ${CALL_MAX_SECONDS:-300}
      VISITOR_CALLS_PER_DAY: ${VISITOR_CALLS_PER_DAY:-3}
      IP_CALLS_PER_DAY: ${IP_CALLS_PER_DAY:-10}
      GLOBAL_MINUTES_PER_DAY: ${GLOBAL_MINUTES_PER_DAY:-120}
      CAPS_TEST_MODE: ${CAPS_TEST_MODE:-false}
      DEPLOYED_ENVIRONMENT: ${DEPLOYED_ENVIRONMENT:-false}
      # Rate limits (ticket 20). Identification: failed name+phone attempts before a lockout.
      ADMISSION_REQUESTS_PER_MINUTE_PER_IP: ${ADMISSION_REQUESTS_PER_MINUTE_PER_IP:-30}
      IDENTITY_FAILURES_PER_NAME: ${IDENTITY_FAILURES_PER_NAME:-5}
      IDENTITY_FAILURES_PER_PHONE: ${IDENTITY_FAILURES_PER_PHONE:-5}
      IDENTITY_FAILURES_GLOBAL: ${IDENTITY_FAILURES_GLOBAL:-30}
      IDENTITY_FAILURE_WINDOW_SECONDS: ${IDENTITY_FAILURE_WINDOW_SECONDS:-600}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  agent:
    build: .
    command: ["python", "-m", "agent.main"]
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-5}
    ports:
      - "${AGENT_PORT:-8001}:8001"
    depends_on:
      - backend

  # Self-hosted LiveKit server, dev mode (documented dev keys devkey/secret; local use only).
  # WebRTC media: 7881/tcp and 7882/udp are published; node_ip in deploy/livekit.yaml makes the
  # server advertise 127.0.0.1, which works for a browser on the same machine.
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--dev", "--bind", "0.0.0.0", "--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # Voice agent worker: joins each new room and runs the Call on the shared agent core.
  voice-agent:
    build: .
    command: ["python", "-m", "voice.worker", "start"]
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-5}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      CALL_MAX_SECONDS: ${CALL_MAX_SECONDS:-300}
      CALL_WARNING_SECONDS: ${CALL_WARNING_SECONDS:-270}
      TURN_LOG_PATH: /app/logs/voice-turns.jsonl
      # In a deployed environment the worker refuses LiveKit's dev keys (devkey/secret).
      DEPLOYED_ENVIRONMENT: ${DEPLOYED_ENVIRONMENT:-false}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - backend
      - livekit

  # Web client: static page plus the token endpoint. Open http://localhost:8002.
  web:
    build: .
    command: ["uvicorn", "voice.web:create_app", "--factory", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:${LIVEKIT_PORT:-7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      BACKEND_URL: http://backend:8000
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-5}
      # Number of reverse proxies of yours in front of this service (0: use the socket address).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Per-IP abuse throttle on POST /token (default 10 a minute), and the same deployed guard.
      TOKEN_REQUESTS_PER_MINUTE_PER_IP: ${TOKEN_REQUESTS_PER_MINUTE_PER_IP:-10}
      DEPLOYED_ENVIRONMENT: ${DEPLOYED_ENVIRONMENT:-false}
    ports:
      - "${WEB_PORT:-8002}:8002"
    depends_on:
      - backend

volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receptio}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: .
    command: ["uvicorn", "backend.app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-receptio}:${POSTGRES_PASSWORD:-receptio}@db:5432/${POSTGRES_DB:-receptio}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  agent:
    build: .
    command: ["python", "-m", "agent.main"]
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-5}
    ports:
      - "${AGENT_PORT:-8001}:8001"
    depends_on:
      - backend

  # TODO (ticket 12): self-hosted LiveKit server (livekit/livekit-server) for the voice
  # pipeline. Not needed for text-mode Calls, so it is deliberately absent from the tracer.

volumes:
  db-data:

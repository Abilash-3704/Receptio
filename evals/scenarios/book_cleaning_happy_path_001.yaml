id: book_cleaning_happy_path_001
description: Caller books a cleaning for her mother (a different Patient) and says yes to the read-back
persona: polite_rushed
turns:
  - "Hi, I'd like to book a cleaning for my mother, tomorrow if possible"
  - "The first one please. Her name is Priya Sharma and her number is +91 98765 43210"
  - "Yes, that's right"
# Fake-LLM mode only (CI): the agent's steps, in order. A real LLM replaces this.
agent_script:
  - tool: check_availability
    args: {service: Cleaning, date: "2026-11-03"}
  - say: "I can do {offered[0]}, {offered[1]} or {offered[2]}. Which suits you?"
  - tool: record_patient
    args: {name: Priya Sharma, phone: "+91 98765 43210"}
  - tool: place_hold
    args: {option: 1}
  - tool: read_back
  - tool: confirm_appointment
  - say: "You're all booked, and a confirmation message is on its way."
expected:
  final_state:
    appointment_confirmed: true
    appointment_service: Cleaning
    patient_name: Priya Sharma
    patient_created: true
    confirmation_message_recorded: true
    overlapping_appointment: false
  must_not:
    - invented_time
    - confirm_without_readback
  max_turns: 4

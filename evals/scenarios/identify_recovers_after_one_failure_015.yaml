id: identify_recovers_after_one_failure_015
description: "One failed identification is not an escalation: the Caller mis-says the number once, corrects it, is identified, and the cancellation goes through with no Escalation"
persona: confused
caller_goal: "You ask to cancel your appointment. First you give the wrong phone number (98450 99999), then correct it to +910000000000. Your name is Seeded Patient. Agree to the cancellation read-back."
turns:
  - "Cancel my appointment please. Seeded Patient, 98450 99999"
  - "Oh sorry, it's +910000000000"
  - "Yes, that's right"
agent_script:
  - tool: identify_patient
    args: {name: Seeded Patient, phone: "98450 99999"}
  - say: "I couldn't match those details. Could you say your name and phone number again?"
  - tool: identify_patient
    args: {name: Seeded Patient, phone: "+910000000000"}
  - tool: request_cancel
  - tool: cancel_appointment
  - say: "That's cancelled. Is there anything else?"
expected:
  final_state:
    appointments_cancelled: 1
    escalation_kind: null
  must_not:
    - revealed_before_identification
    - invented_time
  max_turns: 3

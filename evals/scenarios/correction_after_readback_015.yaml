id: correction_after_readback_015
description: "Tricky call 2. Caller starts to agree to the read-back, then changes the time: the half-yes is not recorded as agreement, a fresh read-back follows, and only its yes confirms"
persona: confused
category: correction
tricky_calls: [2]
caller_goal: "You want a cleaning on Wednesday afternoon for Priya Sharma (phone +91 98765 43210). Take the first time offered. When the details are read back, begin to agree but then say you want 4 pm instead. Agree only to the new read-back."
turns:
  - "A cleaning on Wednesday afternoon please"
  - "The first one. Priya Sharma, +91 98765 43210"
  - "Yes, that's... wait, make it 4 not that"
  - "The first one"
  - "Yes, that's right"
agent_script:
  - tool: check_availability
    args: {service: Cleaning, when: Wednesday afternoon}
  - say: "I can do {offered[0]}, {offered[1]} or {offered[2]}. Which suits you?"
  - tool: record_patient
    args: {name: Priya Sharma, phone: "+91 98765 43210"}
  - tool: place_hold
    args: {option: 1}
  - tool: read_back
  - tool: check_availability
    args: {service: Cleaning, when: Wednesday at 4 pm}
  - say: "For around four I can do {offered[0]} or {offered[1]}."
  - tool: place_hold
    args: {option: 1}
  - tool: read_back
  - tool: confirm_appointment
  - say: "You're all booked."
expected:
  final_state:
    appointment_confirmed: true
    appointment_date: "2026-11-04"
    unreleased_holds: 0
    overlapping_appointment: false
  must_not:
    - invented_time
    - confirm_without_readback
  max_turns: 5

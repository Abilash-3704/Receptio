id: book_named_provider_015
description: "Happy path with a Provider preference: the Caller asks for Dr. Shetty and only that Provider's times are offered"
persona: polite_rushed
category: happy_path
caller_goal: "You want a check-up with Dr. Shetty on Tuesday. You are Rohan Das, phone +91 98450 33333. Take the first time offered and agree to the read-back."
turns:
  - "A check-up with Dr. Shetty on Tuesday please"
  - "The first one. Rohan Das, +91 98450 33333"
  - "Yes, that's right"
agent_script:
  - tool: check_availability
    args: {service: Check-up, when: Tuesday, provider: Shetty}
  - say: "Dr. Shetty has {offered[0]}, {offered[1]} or {offered[2]}."
  - tool: record_patient
    args: {name: Rohan Das, phone: "+91 98450 33333"}
  - tool: place_hold
    args: {option: 1}
  - tool: read_back
  - tool: confirm_appointment
  - say: "You're all booked with Dr. Shetty."
expected:
  final_state:
    appointment_confirmed: true
    appointment_service: Check-up
    unreleased_holds: 0
  must_not:
    - invented_time
    - confirm_without_readback
  max_turns: 3

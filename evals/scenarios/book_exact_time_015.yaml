id: book_exact_time_015
description: "Happy path with one specific time ('at 4 pm'): the nearest open times from then on are offered, not an invented 4 pm"
persona: rushed
category: happy_path
caller_goal: "You want a filling on Wednesday at 4 pm. You are Rohan Das, phone +91 98450 33333. Take the first time offered and agree to the read-back."
turns:
  - "A filling on Wednesday at 4 pm"
  - "The first. Rohan Das, +91 98450 33333"
  - "Yes"
agent_script:
  - tool: check_availability
    args: {service: Filling, when: Wednesday at 4 pm}
  - say: "The nearest I have from then is {offered[0]} or {offered[1]}."
  - tool: record_patient
    args: {name: Rohan Das, phone: "+91 98450 33333"}
  - tool: place_hold
    args: {option: 1}
  - tool: read_back
  - tool: confirm_appointment
  - say: "You're all booked."
expected:
  final_state:
    appointment_confirmed: true
    appointment_date: "2026-11-04"
    unreleased_holds: 0
  must_not:
    - invented_time
    - confirm_without_readback
    - offered_outside_clinic_hours
  max_turns: 3

id: hold_expired_then_rebooked_015
description: "Tricky call 13. The Caller takes six minutes to answer the read-back, so the Hold has expired: nothing is claimed as Confirmed, Availability is checked again, a new Hold and a new read-back are needed, and only that yes confirms"
persona: confused
category: hold_race
tricky_calls: [13]
caller_goal: "You want a cleaning on Tuesday for Neha Kapoor (+91 98450 22222). You take a long time (about six minutes) to answer the read-back. When told the time has gone, take the first new time and agree to the new read-back."
turns:
  - "A cleaning on Tuesday"
  - "The first one. Neha Kapoor, +91 98450 22222"
  - "Yes, sorry, that's right"
  - "The first one"
  - "Yes, that's right"
advance_minutes:
  2: 6
agent_script:
  - tool: check_availability
    args: {service: Cleaning, when: Tuesday}
  - say: "I can do {offered[0]}, {offered[1]} or {offered[2]}."
  - tool: record_patient
    args: {name: Neha Kapoor, phone: "+91 98450 22222"}
  - tool: place_hold
    args: {option: 1}
  - tool: read_back
  - tool: check_availability
    args: {service: Cleaning, when: Tuesday}
  - say: "I'm sorry, that time was released while we waited. I can do {offered[0]}, {offered[1]} or {offered[2]} now."
  - tool: place_hold
    args: {option: 1}
  - tool: read_back
  - tool: confirm_appointment
  - say: "You're all booked."
expected:
  final_state:
    appointment_confirmed: true
    appointment_date: "2026-11-03"
    unreleased_holds: 0
    overlapping_appointment: false
  must_not:
    - invented_time
    - confirm_without_readback
  max_turns: 5
